name: insurance-campaign-local
services:
  auth-db:
    image: postgres:latest
    pull_policy: always
    ports:
    - "5433:5432"
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
    - auth-db-local-pg-data:/var/lib/postgresql
    networks:
    - insurance-local-network
  campaign-db:
    image: postgres:latest
    pull_policy: always
    ports:
    - "5434:5432"
    environment:
      POSTGRES_DB: campaign_db
      POSTGRES_USER: campaign_user
      POSTGRES_PASSWORD: campaign_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campaign_user -d campaign_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
    - campaign-db-local-pg-data:/var/lib/postgresql
    networks:
    - insurance-local-network
  redis:
    image: redis:latest
    pull_policy: always
    ports:
    - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
    - redis-local-data:/data
    networks:
    - insurance-local-network
  kafka:
    image: apache/kafka:latest
    pull_policy: always
    user: 0:0
    ports:
    - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 45s
    volumes:
    - kafka-local-data:/tmp/kraft-combined-logs
    networks:
    - insurance-local-network
  kafka-ui:
    image: kafbat/kafka-ui:latest
    pull_policy: always
    ports:
    - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: 'true'
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
    - insurance-local-network
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    pull_policy: always
    ports:
    - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      xpack.security.http.ssl.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=10s' | grep -q '\"timed_out\":false'" ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped
    volumes:
      - elasticsearch-local-data:/usr/share/elasticsearch/data
    networks:
      - insurance-local-network
  prometheus:
    image: prom/prometheus:latest
    pull_policy: always
    ports:
    - "9091:9090"
    volumes:
    - ./observability/prometheus/prometheus-local.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
    - host.docker.internal:host-gateway
    networks:
    - insurance-local-network
  grafana:
    image: grafana/grafana:latest
    pull_policy: always
    ports:
    - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
    - grafana-local-data:/var/lib/grafana
    - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
    - prometheus
    - tempo
    - loki
    - promtail
    networks:
    - insurance-local-network
  tempo:
    image: grafana/tempo:latest
    pull_policy: always
    user: 0:0
    command:
    - -target=all
    - -config.file=/etc/tempo.yml
    ports:
    - "3200:3200"
    volumes:
    - ./observability/tempo/tempo.yml:/etc/tempo.yml:ro
    - tempo-local-data:/var/tempo
    restart: unless-stopped
    networks:
    - insurance-local-network
  loki:
    image: grafana/loki:latest
    pull_policy: always
    user: 0:0
    command:
    - -config.file=/etc/loki/local-config.yaml
    ports:
    - "3100:3100"
    volumes:
    - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    - loki-local-data:/tmp/loki
    restart: unless-stopped
    networks:
    - insurance-local-network
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    pull_policy: always
    command:
    - --config=/etc/otel-collector.yml
    ports:
    - 4317:4317
    - 4318:4318
    volumes:
    - ./observability/otel-collector/otel-collector.yml:/etc/otel-collector.yml:ro
    depends_on:
    - tempo
    networks:
    - insurance-local-network
  sonarqube:
    image: sonarqube:community
    pull_policy: always
    ports:
    - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: 'true'
    volumes:
    - sonarqube-local-data:/opt/sonarqube/data
    - sonarqube-local-extensions:/opt/sonarqube/extensions
    networks:
    - insurance-local-network
  promtail:
    image: grafana/promtail:latest
    pull_policy: always
    command:
    - -config.file=/etc/promtail/config.yml
    ports:
    - 9080:9080
    volumes:
    - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
    - ./logs:/var/log/insurance:ro
    depends_on:
    - loki
    restart: unless-stopped
    networks:
    - insurance-local-network
volumes:
  auth-db-local-pg-data: null
  campaign-db-local-pg-data: null
  redis-local-data: null
  kafka-local-data: null
  elasticsearch-local-data: null
  grafana-local-data: null
  tempo-local-data: null
  loki-local-data: null
  sonarqube-local-data: null
  sonarqube-local-extensions: null
networks:
  insurance-local-network:
    driver: bridge
