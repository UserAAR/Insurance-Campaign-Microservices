server:
  port: 8761
spring:
  application:
    name: discovery-server
  threads:
    virtual:
      enabled: true
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
    export:
      otlp:
        enabled: ${MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED:true}
  opentelemetry:
    resource-attributes:
      service.name: ${OTEL_SERVICE_NAME:${spring.application.name}}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4317}
          transport: ${OTEL_EXPORTER_OTLP_TRACES_PROTOCOL:grpc}
logging:
  file:
    name: ${LOGGING_FILE_NAME:logs/discovery-server.log}
  pattern:
    level: '%5p [discovery-server,%X{traceId:-},%X{spanId:-}]'
