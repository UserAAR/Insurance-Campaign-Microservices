name: insurance-campaign-microservices
services:
  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    container_name: discovery-server
    ports:
    - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OTEL_SERVICE_NAME: discovery-server
      OTEL_RESOURCE_ATTRIBUTES: service.name=discovery-server,deployment.environment=docker
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: grpc
      MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: 'true'
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: '1.0'
      LOGGING_FILE_NAME: /app/logs/discovery-server.log
    networks:
    - insurance-network
    volumes:
    - ./logs:/app/logs
    depends_on:
    - otel-collector
  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: config-server
    ports:
    - "8888:8888"
    environment:
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka
      EUREKA_INSTANCE_IP_ADDRESS: config-server
      OTEL_SERVICE_NAME: config-server
      OTEL_RESOURCE_ATTRIBUTES: service.name=config-server,deployment.environment=docker
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: grpc
      MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: 'true'
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: '1.0'
      LOGGING_FILE_NAME: /app/logs/config-server.log
    depends_on:
    - discovery-server
    - otel-collector
    networks:
    - insurance-network
    volumes:
    - ./logs:/app/logs
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
    - "8080:8080"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka
      EUREKA_INSTANCE_IP_ADDRESS: api-gateway
      AUTH_SERVICE_URI: lb://auth-service
      CAMPAIGN_SERVICE_URI: lb://campaign-service
      DASHBOARD_SERVICE_URI: lb://dashboard-service
      LOG_SERVICE_URI: lb://log-service
      APP_OPENAPI_AUTH_SERVICE_URL: lb://auth-service/v3/api-docs
      APP_OPENAPI_CAMPAIGN_SERVICE_URL: lb://campaign-service/v3/api-docs
      APP_OPENAPI_DASHBOARD_SERVICE_URL: lb://dashboard-service/v3/api-docs
      APP_OPENAPI_LOG_SERVICE_URL: lb://log-service/v3/api-docs
      JWT_PUBLIC_KEY_LOCATION: classpath:keys/public.pem
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RATE_LIMITER_REPLENISH_RATE: 1
      RATE_LIMITER_BURST_CAPACITY: 5
      RATE_LIMITER_REQUESTED_TOKENS: 5
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: grpc
      OTEL_SERVICE_NAME: api-gateway
      OTEL_RESOURCE_ATTRIBUTES: service.name=api-gateway,deployment.environment=docker
      MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: 'true'
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: '1.0'
      LOGGING_FILE_NAME: /app/logs/api-gateway.log
    depends_on:
    - config-server
    - discovery-server
    - otel-collector
    - redis
    networks:
    - insurance-network
    volumes:
    - ./logs:/app/logs
  auth-db:
    image: postgres:latest
    pull_policy: always
    container_name: auth-db
    ports:
    - "5433:5432"
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
    - auth-db-pg-data:/var/lib/postgresql
    networks:
    - insurance-network
  campaign-db:
    image: postgres:latest
    pull_policy: always
    container_name: campaign-db
    ports:
    - "5434:5432"
    environment:
      POSTGRES_DB: campaign_db
      POSTGRES_USER: campaign_user
      POSTGRES_PASSWORD: campaign_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campaign_user -d campaign_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
    - campaign-db-pg-data:/var/lib/postgresql
    networks:
    - insurance-network
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    ports:
    - "8081:8081"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka
      EUREKA_INSTANCE_IP_ADDRESS: auth-service
      AUTH_DB_URL: jdbc:postgresql://auth-db:5432/auth_db
      AUTH_DB_USERNAME: auth_user
      AUTH_DB_PASSWORD: auth_password
      LOG_SERVICE_URL: http://log-service:8084
      JWT_PUBLIC_KEY_LOCATION: classpath:keys/public.pem
      JWT_PRIVATE_KEY_LOCATION: classpath:keys/private.pem
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: grpc
      OTEL_SERVICE_NAME: auth-service
      OTEL_RESOURCE_ATTRIBUTES: service.name=auth-service,deployment.environment=docker
      MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: 'true'
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: '1.0'
      LOGGING_FILE_NAME: /app/logs/auth-service.log
      LOG_SERVICE_CB_FAILURE_RATE_THRESHOLD: 50
      LOG_SERVICE_CB_SLIDING_WINDOW_SIZE: 10
      LOG_SERVICE_CB_MINIMUM_NUMBER_OF_CALLS: 5
      LOG_SERVICE_CB_PERMITTED_CALLS_IN_HALF_OPEN_STATE: 3
      LOG_SERVICE_CB_WAIT_DURATION_IN_OPEN_STATE: 30s
      LOG_SERVICE_RETRY_MAX_ATTEMPTS: 3
      LOG_SERVICE_RETRY_WAIT_DURATION: 500ms
      LOG_SERVICE_BULKHEAD_MAX_CONCURRENT_CALLS: 10
      LOG_SERVICE_BULKHEAD_MAX_WAIT_DURATION: 0ms
    depends_on:
      auth-db:
        condition: service_healthy
      config-server:
        condition: service_started
      otel-collector:
        condition: service_started
    restart: unless-stopped
    networks:
    - insurance-network
    volumes:
    - ./logs:/app/logs
  campaign-service:
    build:
      context: .
      dockerfile: campaign-service/Dockerfile
    container_name: campaign-service
    ports:
    - "8082:8082"
    - "9090:9090"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka
      EUREKA_INSTANCE_IP_ADDRESS: campaign-service
      CAMPAIGN_DB_URL: jdbc:postgresql://campaign-db:5432/campaign_db
      CAMPAIGN_DB_USERNAME: campaign_user
      CAMPAIGN_DB_PASSWORD: campaign_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: grpc
      JWT_PUBLIC_KEY_LOCATION: classpath:keys/public.pem
      OTEL_SERVICE_NAME: campaign-service
      OTEL_RESOURCE_ATTRIBUTES: service.name=campaign-service,deployment.environment=docker
      MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: 'true'
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: '1.0'
      LOGGING_FILE_NAME: /app/logs/campaign-service.log
    depends_on:
    - campaign-db
    - redis
    - kafka
    - config-server
    - otel-collector
    networks:
    - insurance-network
    volumes:
    - ./logs:/app/logs
  dashboard-service:
    build:
      context: .
      dockerfile: dashboard-service/Dockerfile
    container_name: dashboard-service
    ports:
    - "8083:8083"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka
      EUREKA_INSTANCE_IP_ADDRESS: dashboard-service
      CAMPAIGN_GRPC_ADDRESS: static://campaign-service:9090
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: grpc
      JWT_PUBLIC_KEY_LOCATION: classpath:keys/public.pem
      OTEL_SERVICE_NAME: dashboard-service
      OTEL_RESOURCE_ATTRIBUTES: service.name=dashboard-service,deployment.environment=docker
      MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: 'true'
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: '1.0'
      LOGGING_FILE_NAME: /app/logs/dashboard-service.log
    depends_on:
      campaign-service:
        condition: service_started
      config-server:
        condition: service_started
      otel-collector:
        condition: service_started
    restart: unless-stopped
    networks:
    - insurance-network
    volumes:
    - ./logs:/app/logs
  log-service:
    build:
      context: .
      dockerfile: log-service/Dockerfile
    container_name: log-service
    ports:
    - "8084:8084"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka
      EUREKA_INSTANCE_IP_ADDRESS: log-service
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_ELASTICSEARCH_CONNECTION_TIMEOUT: 10s
      SPRING_ELASTICSEARCH_SOCKET_TIMEOUT: 30s
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: grpc
      JWT_PUBLIC_KEY_LOCATION: classpath:keys/public.pem
      OTEL_SERVICE_NAME: log-service
      OTEL_RESOURCE_ATTRIBUTES: service.name=log-service,deployment.environment=docker
      MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: 'true'
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: '1.0'
      LOGGING_FILE_NAME: /app/logs/log-service.log
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      config-server:
        condition: service_started
      otel-collector:
        condition: service_started
    restart: on-failure:5
    networks:
    - insurance-network
    volumes:
    - ./logs:/app/logs
  redis:
    image: redis:latest
    pull_policy: always
    container_name: redis
    ports:
    - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
    - redis-data:/data
    networks:
    - insurance-network
  kafka:
    image: apache/kafka:latest
    pull_policy: always
    container_name: kafka
    user: 0:0
    ports:
    - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 45s
    volumes:
    - kafka-data:/tmp/kraft-combined-logs
    networks:
    - insurance-network
  kafka-ui:
    image: kafbat/kafka-ui:latest
    pull_policy: always
    container_name: kafka-ui
    ports:
    - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: 'true'
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
    - insurance-network
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    pull_policy: always
    container_name: elasticsearch
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      xpack.security.http.ssl.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=10s' | grep -q '\"timed_out\":false'" ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - insurance-network
  prometheus:
    image: prom/prometheus:latest
    pull_policy: always
    container_name: prometheus
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --web.enable-lifecycle
    - --web.enable-remote-write-receiver
    ports:
    - "9091:9090"
    volumes:
    - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus-data:/prometheus
    networks:
    - insurance-network
  grafana:
    image: grafana/grafana:latest
    pull_policy: always
    container_name: grafana
    ports:
    - 3000:3000
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
    - grafana-data:/var/lib/grafana
    - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
    - prometheus
    - tempo
    - loki
    - promtail
    networks:
    - insurance-network
  tempo:
    image: grafana/tempo:latest
    pull_policy: always
    container_name: tempo
    user: 0:0
    command:
    - -target=all
    - -config.file=/etc/tempo.yml
    ports:
    - 3200:3200
    volumes:
    - ./observability/tempo/tempo.yml:/etc/tempo.yml:ro
    - tempo-data:/var/tempo
    restart: unless-stopped
    networks:
    - insurance-network
  loki:
    image: grafana/loki:latest
    pull_policy: always
    container_name: loki
    user: 0:0
    command:
    - -config.file=/etc/loki/local-config.yaml
    ports:
    - 3100:3100
    volumes:
    - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    - loki-data:/tmp/loki
    restart: unless-stopped
    networks:
    - insurance-network
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    pull_policy: always
    container_name: otel-collector
    command:
    - --config=/etc/otel-collector.yml
    ports:
    - 4317:4317
    - 4318:4318
    volumes:
    - ./observability/otel-collector/otel-collector.yml:/etc/otel-collector.yml:ro
    depends_on:
    - tempo
    networks:
    - insurance-network
  sonarqube:
    image: sonarqube:community
    pull_policy: always
    container_name: sonarqube
    ports:
    - 9000:9000
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: 'true'
    volumes:
    - sonarqube-data:/opt/sonarqube/data
    - sonarqube-extensions:/opt/sonarqube/extensions
    networks:
    - insurance-network
  promtail:
    image: grafana/promtail:latest
    pull_policy: always
    command:
    - -config.file=/etc/promtail/config.yml
    ports:
    - 9080:9080
    volumes:
    - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
    - ./logs:/var/log/insurance:ro
    depends_on:
    - loki
    restart: unless-stopped
    networks:
    - insurance-network
    container_name: promtail
volumes:
  auth-db-pg-data: null
  campaign-db-pg-data: null
  redis-data: null
  kafka-data: null
  elasticsearch-data: null
  prometheus-data: null
  grafana-data: null
  tempo-data: null
  loki-data: null
  sonarqube-data: null
  sonarqube-extensions: null
networks:
  insurance-network:
    driver: bridge
