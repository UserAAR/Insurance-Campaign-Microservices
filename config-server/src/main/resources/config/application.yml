spring:
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: com.casestudy.insurancecampaign.*

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}

app:
  slow-request-threshold-ms: 5
  kafka:
    topics:
      log-events: log-events
      campaign-events: campaign-events
  jwt:
    issuer: allianz-campaign-api
    expiration-minutes: 120
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:classpath:keys/public.pem}

management:
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED:true}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  opentelemetry:
    resource-attributes:
      service.name: ${OTEL_SERVICE_NAME:${spring.application.name}}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4317}

          transport: ${OTEL_EXPORTER_OTLP_TRACES_PROTOCOL:grpc}