global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]
  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth-service:8081"]
  - job_name: campaign-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["campaign-service:8082"]
  - job_name: dashboard-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["dashboard-service:8083"]
  - job_name: log-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["log-service:8084"]
